name: Build IGI 3 - Sontek Kajla (Windows)

# Every push builds a fresh Windows .exe and runs the four headless regression
# suites. Pushing a v* tag also uploads the .exe to that GitHub Release.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "stable"
  EXE_NAME: "IGI3_SontekKajla.exe"

jobs:
  build:
    name: Test + export Windows .exe
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $base = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-$env:GODOT_RELEASE"
          Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-$env:GODOT_RELEASE`_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath "$env:RUNNER_TEMP\godot" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\godot" -Filter "*_console.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Godot console executable not found" }
          "GODOT=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $exe.FullName --version

      - name: Install Windows export templates
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $base = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-$env:GODOT_RELEASE"
          Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-$env:GODOT_RELEASE`_export_templates.tpz" -OutFile templates.zip
          Expand-Archive templates.zip -DestinationPath "$env:RUNNER_TEMP\tpl" -Force
          $dst = Join-Path $env:APPDATA "Godot\export_templates\$env:GODOT_VERSION.$env:GODOT_RELEASE"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "$env:RUNNER_TEMP\tpl\templates\version.txt" $dst
          Copy-Item "$env:RUNNER_TEMP\tpl\templates\windows_*_x86_64*.exe" $dst
          Get-ChildItem $dst

      - name: Import project (first-time asset import)
        run: |
          & $env:GODOT --headless --path . --import 2>&1 | Out-Host
          & $env:GODOT --headless --path . --import 2>&1 | Out-Host
          exit 0

      - name: Smoke test - menu boots cleanly
        run: |
          & $env:GODOT --headless --path . res://scenes/SontekMenu.tscn --quit-after 240 *> menu.log
          Select-String -Path menu.log -Pattern "SCRIPT ERROR|Parse Error" | Out-Host
          if (Select-String -Path menu.log -Pattern "SCRIPT ERROR|Parse Error" -Quiet) {
            throw "Menu script errors found - see above"
          }
          "Menu smoke test passed"
          exit 0

      - name: Headless regression tests (city, missions, neutral forces, saves)
        run: |
          $tests = @(
            @{ Scene = "CityTest";    Mission = "";  Pass = '\[CITY\] PASS' },
            @{ Scene = "IgiTest";     Mission = "1"; Pass = '\[IGI\] PASS' },
            @{ Scene = "IgiTest";     Mission = "15"; Pass = '\[IGI\] PASS' },
            @{ Scene = "NeutralTest"; Mission = "";  Pass = '\[NEUTRAL\] PASS' },
            @{ Scene = "SaveTest";    Mission = "";  Pass = '\[SAVE\] PASS' }
          )
          foreach ($t in $tests) {
            if ($t.Mission) { $env:MISSION = $t.Mission }
            else { Remove-Item Env:MISSION -ErrorAction SilentlyContinue }
            $log = "$($t.Scene)-$($t.Mission).log"
            & $env:GODOT --headless --path . "res://tools/test/$($t.Scene).tscn" *> $log
            $code = $LASTEXITCODE
            Write-Output "--- $($t.Scene) M$($t.Mission) (exit $code) ---"
            Select-String -Path $log -Pattern '\[CITY\]|\[IGI\]|\[NEUTRAL\]|\[SAVE\]|SCRIPT ERROR|Parse Error' |
              ForEach-Object { $_.Line } | Out-Host
            if ($code -ne 0) { throw "$($t.Scene) M$($t.Mission) exited with $code" }
            if (-not (Select-String -Path $log -Pattern $t.Pass -Quiet)) {
              throw "$($t.Scene) M$($t.Mission) did not print PASS"
            }
          }
          "All regression tests passed"
          exit 0

      - name: Export Windows release build
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          & $env:GODOT --headless --path . --export-release "Windows Desktop" "build\$env:EXE_NAME" 2>&1 | Out-Host
          if (-not (Test-Path "build\$env:EXE_NAME")) { throw "Export failed: build\$env:EXE_NAME was not created" }
          Get-Item "build\$env:EXE_NAME" | Select-Object Name,Length

      - name: Package player notes and visuals
        run: |
          Copy-Item README.md build\
          Copy-Item CITY_DESIGN.md build\
          New-Item -ItemType Directory -Force -Path build\docs | Out-Null
          Copy-Item docs\* build\docs\ -Recurse
          $controls = @(
            'WASD move | Shift sprint | Ctrl crouch/prone | C/Q lean',
            'LMB fire | RMB aim | 8 scope | R reload',
            '1-3 weapons | 4 grenade | 5 molotov | 6 time bomb',
            'E interact / shop / vault / photo / drive',
            'T thermal | N headphones | B binoculars | M map | Tab objectives | Esc pause'
          )
          Set-Content -Encoding utf8 build\CONTROLS.txt $controls

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: IGI3-SontekKajla-Windows
          path: build/
          if-no-files-found: error
          retention-days: 30

      - name: Attach .exe to the tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not (gh release view $tag 2>$null)) {
            gh release create $tag --title $tag --notes "Automated Windows build from GitHub Actions"
          }
          gh release upload $tag "build\$env:EXE_NAME" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
